name: CI

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Konversi Markdown adalah bagian paling rapuh => diuji lebih dulu dan
  # dijalankan di semua PR. Jsdom menjalankan Quill 2 + marked yang SAMA dengan
  # yang di-vendoring, jadi ini round-trip sungguhan, bukan mock.
  # ---------------------------------------------------------------------------
  test:
    name: Tes konversi (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Runtime browser sungguhan: menangkap masalah DOM, keyboard, download, dan
  # request gambar yang tidak dapat dibuktikan oleh jsdom. Tetap terpisah dari
  # validasi webview Tauri native pada DESKTOP-TEST-CHECKLIST.md.
  browser-runtime:
    name: Runtime Chromium
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pasang tooling browser opsional (versi dipin)
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright-core@1.64.1 @sparticuz/chromium@153.0.0
      - run: npm run test:browser

  # ---------------------------------------------------------------------------
  # Toolchain Rust tidak selalu tersedia di mesin kontributor. Job ini yang
  # menjamin kode Rust tetap bisa dikompilasi di ketiga sistem operasi.
  # ---------------------------------------------------------------------------
  rust-check:
    name: Build Rust (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Dependensi sistem (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb xauth xdotool scrot

      - name: Cargo build
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Tes recovery Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Pasang tauri-driver 2.1.0 (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Validasi WebView Tauri native (Linux/Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1200x800x24" npm run test:native
        env:
          MARKRUST_NATIVE_ARTIFACTS: native-artifacts
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'

      - name: Validasi dua proses Tauri native (Linux/Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1200x800x24" npm run test:native:multi
        env:
          MARKRUST_NATIVE_ARTIFACTS: native-artifacts
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'

      - name: Simpan bukti WebView native (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-webview-linux
          path: native-artifacts/
          if-no-files-found: warn
          retention-days: 7

      # Toolchain Rust tidak tersedia di semua mesin kontributor. Artifak ini
      # berisi Cargo.lock yang sudah diselesaikan Cargo (termasuk plugin baru),
      # jadi bisa langsung disalin ke repo tanpa harus build lokal.
      - name: Simpan Cargo.lock hasil resolusi
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Bundel installer hanya dibuat saat rilis, supaya PR tidak memakan menit
  # CI untuk mengunduh toolchain bundling yang berat.
  # ---------------------------------------------------------------------------
  bundle:
    name: Bundel rilis
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, browser-runtime, rust-check]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Dependensi sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'MarkRust ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
